<div id="content">
  <h1>Đăng ký nhận thông tin</h1>
  <p>Điền thông tin bên dưới để nhận bản tin định kỳ. Các trường có dấu * là bắt buộc.</p>
  <form id="register-form" action="#" method="post">
    <fieldset>
      <legend>Thông tin tài khoản</legend>
      <p><label for="fullname">Họ và tên *</label><br>
      <input type="text" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required></p>
      <p><label for="email">Email *</label><br>
      <input type="email" id="email" name="email" placeholder="ban@example.com" required></p>
      <p><label for="password">Mật khẩu * (tối thiểu 8 ký tự)</label><br>
      <input type="password" id="password" name="password" minlength="8" required></p>
      <p><label for="phone">Số điện thoại * (10 số, bắt đầu bằng 0)</label><br>
      <input type="tel" id="phone" name="phone" pattern="0[0-9]{9}" title="10 chữ số, bắt đầu bằng 0" required></p>
    </fieldset>
    <fieldset>
      <legend>Thông tin cá nhân</legend>
      <p><label for="dob">Ngày sinh *</label><br>
      <input type="date" id="dob" name="dob" required></p>
      <p><label for="age">Độ tuổi *</label><br>
      <input type="number" id="age" name="age" min="10" max="100" class="short" required></p>
      <p>Giới tính *</p>
      <p>
        <input type="radio" id="male" name="gender" value="nam" required> <label for="male">Nam</label>
        <input type="radio" id="female" name="gender" value="nu"> <label for="female">Nữ</label>
        <input type="radio" id="other" name="gender" value="khac"> <label for="other">Khác</label>
      </p>
    </fieldset>
    <fieldset>
      <legend>Tuỳ chọn nhận tin</legend>
      <p>Chủ đề quan tâm</p>
      <p>
        <input type="checkbox" id="t-news" name="topics" value="tintuc"> <label for="t-news">Tin tức</label>
        <input type="checkbox" id="t-blog" name="topics" value="blog"> <label for="t-blog">Blog</label>
        <input type="checkbox" id="t-event" name="topics" value="sukien"> <label for="t-event">Sự kiện</label>
      </p>
      <p><label for="region">Khu vực</label><br>
      <select id="region" name="region">
        <option value="">-- Chọn khu vực --</option>
        <option value="bac">Miền Bắc</option>
        <option value="trung">Miền Trung</option>
        <option value="nam">Miền Nam</option>
      </select></p>
      <p><label for="message">Lời nhắn</label><br>
      <textarea id="message" name="message" rows="4" cols="40" placeholder="Bạn muốn nhận nội dung gì?"></textarea></p>
      <p><input type="checkbox" id="agree" name="agree" required>
      <label for="agree">Tôi đồng ý với điều khoản sử dụng *</label></p>
    </fieldset>
    <input type="submit" value="Đăng ký" class="btn">
    <input type="reset" value="Nhập lại" class="btn">
  </form>
</div>
